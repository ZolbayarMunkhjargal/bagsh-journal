# ===========================================================================
# KinderJournal - English interface text
#
# This file is the master list. Every key the interface uses is defined here.
# Other languages (see messages_mn.properties) translate a subset; anything they
# omit falls back to the English text below, so a partial translation still
# leaves a usable program.
#
# Placeholders are written {0}, {1} and so on and are replaced by the values
# passed to Messages.get(key, value...). Keep them in the translation.
#
# Keys are grouped by the part of the program they belong to.
# ===========================================================================


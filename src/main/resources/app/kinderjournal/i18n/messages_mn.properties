# Written in Cyrillic, which is the standard script in Mongolia. The bundled
# "Segoe UI" font renders it, so no extra font is needed.
#
# Any key missing here falls back to the English text, so a partial translation
# leaves a usable program rather than blank labels.
# ===========================================================================

